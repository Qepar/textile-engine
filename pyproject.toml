[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qepar-textile-engine"
version = "0.1.0"
description = "Experimental textile dynamics with a verified CPU correctness baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
render = ["PyOpenGL>=3.1"]

[tool.setuptools.packages.find]
include = ["core*", "utils*", "rendering*", "examples*", "native*"]

[tool.setuptools.package-data]
native = ["*.cpp"]
